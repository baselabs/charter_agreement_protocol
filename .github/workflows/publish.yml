name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # No green run yet; bounded publication job.
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse refs outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Refuse Node runtime drift
        run: test "$(node --version)" = "v$(awk '$1 == "nodejs" {print $2}' .tool-versions)"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Refuse BEAM runtime drift
        run: |
          expected_elixir=$(awk '$1 == "elixir" {print $2}' .tool-versions)
          expected_otp=$(awk '$1 == "erlang" {print $2}' .tool-versions)
          actual_otp=$(erl -noshell -eval 'Major = erlang:system_info(otp_release), {ok, Bytes} = file:read_file(filename:join([code:root_dir(), "releases", Major, "OTP_VERSION"])), io:put_chars(string:trim(binary_to_list(Bytes))), halt().')
          test "$actual_otp" = "$expected_otp"
          test "$(elixir --short-version)" = "${expected_elixir%-otp-*}"

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Build documentation
        run: mix docs --warnings-as-errors

      - name: Materialize the pinned verifier
        run: mix verifier.source

      - name: Inspect package contents and reproducibility
        run: mix release.candidate

      - name: Build the package
        run: mix hex.build

      - name: Refuse existing releases and publish the package and documentation
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          version=$(sed -n 's/^  @version "\([^"]*\)"$/\1/p' mix.exs)
          test -n "$version"
          if info=$(mix hex.info charter_agreement_protocol "$version" 2>&1); then
            echo "::error::This package version is already published"
            exit 1
          fi
          # Hex uses the same exit status for a missing release and API errors.
          # Only its explicit not-found response authorizes a new publication.
          if ! printf '%s\n' "$info" | grep -Fq "No release with name charter_agreement_protocol $version"; then
            printf '%s\n' "$info"
            echo "::error::Could not establish that this registry version is absent"
            exit 1
          fi
          tags=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}")
          if [ -n "$tags" ]; then
            echo "::error::This release version is already tagged"
            exit 1
          fi
          mix hex.publish --yes
