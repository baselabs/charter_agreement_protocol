name: Publish

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Qualified release commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      qualification_run:
        description: Original CI run ID when retrying publication
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      qualification-run: ${{ steps.upload.outputs.qualification-run }}
      qualification-sha256: ${{ steps.upload.outputs.qualification-sha256 }}
    steps:
      - name: Validate the dispatch inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read locked BEAM versions as data
        id: toolchain
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import re, sys
          versions = {}
          for line in sys.stdin:
              tool, *values = line.split("#", 1)[0].split() or [""]
              if tool in ("elixir", "erlang"):
                  if tool in versions or not values:
                      sys.exit("Invalid locked BEAM version rows")
                  versions[tool] = values[0]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+", versions.get("elixir", "")):
              sys.exit("Invalid locked Elixir version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?", versions.get("erlang", "")):
              sys.exit("Invalid locked Erlang version")
          if versions["elixir"].rsplit("-", 1)[1] != versions["erlang"].split(".", 1)[0]:
              sys.exit("Locked BEAM versions disagree")
          print("elixir=" + versions["elixir"])
          print("otp=" + versions["erlang"])
          ' >> "$GITHUB_OUTPUT"
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          install-hex: false
          install-rebar: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Upload qualified Hex archives
        id: upload
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: upload
          package: charter_agreement_protocol
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ inputs.qualification_run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read locked BEAM versions as data
        id: toolchain
        run: |
          git show HEAD:.tool-versions | python3 -I -c '
          import re, sys
          versions = {}
          for line in sys.stdin:
              tool, *values = line.split("#", 1)[0].split() or [""]
              if tool in ("elixir", "erlang"):
                  if tool in versions or not values:
                      sys.exit("Invalid locked BEAM version rows")
                  versions[tool] = values[0]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-otp-[0-9]+", versions.get("elixir", "")):
              sys.exit("Invalid locked Elixir version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?", versions.get("erlang", "")):
              sys.exit("Invalid locked Erlang version")
          if versions["elixir"].rsplit("-", 1)[1] != versions["erlang"].split(".", 1)[0]:
              sys.exit("Locked BEAM versions disagree")
          print("elixir=" + versions["elixir"])
          print("otp=" + versions["erlang"])
          ' >> "$GITHUB_OUTPUT"
      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-type: strict
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          install-hex: false
          install-rebar: false
      - name: Refuse BEAM runtime drift
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: |
          elixir_version="$(elixir -e 'IO.write(System.version() <> "-otp-" <> System.build_info()[:otp_release])')"
          otp_version="$(erl -noshell -noinput -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')"
          test "$elixir_version" = "$EXPECTED_ELIXIR"
          test "$otp_version" = "$EXPECTED_OTP"
      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force
      - name: Verify served Hex archives
        id: served
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        with:
          operation: read-back
          package: charter_agreement_protocol
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ github.workspace }}/release-assets

      - name: Upload consumer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            release-assets/charter_agreement_protocol-*.tar
            release-assets/charter_agreement_protocol-*-docs.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Remove release assets
        if: always()
        run: rm -rf -- release-assets
