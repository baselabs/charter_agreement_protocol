name: Publish

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Qualified release commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate the qualified release commit
        id: validate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "::error::Publication requires the default branch"; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_commit must be 40 lowercase hexadecimal characters"; exit 1; }
          repo="repos/$GITHUB_REPOSITORY"
          merge_base=$(gh api "$repo/compare/$RELEASE_COMMIT...$DEFAULT_BRANCH" --jq '.merge_base_commit.sha')
          test "$merge_base" = "$RELEASE_COMMIT" || { echo "::error::release_commit is outside the default branch history"; exit 1; }
          gh api --paginate "$repo/commits/$RELEASE_COMMIT/check-runs?check_name=qualified&status=completed&filter=all&per_page=100" \
            --jq '.check_runs[] | select(.name == "qualified" and .conclusion == "success" and .app.slug == "github-actions") | .head_sha' |
            grep -Fx "$RELEASE_COMMIT" >/dev/null || { echo "::error::release_commit has no successful qualified check"; exit 1; }
          version=$(gh api "$repo/contents/mix.exs?ref=$RELEASE_COMMIT" --jq '.content' | base64 --decode | sed -n 's/^  @version "\([^"]*\)".*$/\1/p')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]] || { echo "::error::release_commit does not declare a release version"; exit 1; }
          tags=$(gh api "$repo/git/matching-refs/tags/v$version" --jq '.[].ref')
          if grep -Fx "refs/tags/v$version" <<< "$tags" >/dev/null; then
            echo "::error::This release version is already tagged"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-26.04
    timeout-minutes: 90 # no green run yet
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      VERSION: ${{ needs.release.outputs.version }}
    outputs:
      elixir: ${{ steps.toolchain.outputs.elixir }}
      otp: ${{ steps.toolchain.outputs.otp }}
      package: ${{ steps.plan.outputs.package }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - name: Refuse refs outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Load release scripts from the workflow revision
        run: |
          mkdir "$RUNNER_TEMP/release-workflow"
          git show "$GITHUB_SHA:scripts/hex_release_state.ex" > "$RUNNER_TEMP/release-workflow/hex_release_state.ex"
          git show "$GITHUB_SHA:scripts/hex_release_state.exs" > "$RUNNER_TEMP/release-workflow/hex_release_state.exs"

      - name: Read runtime versions
        id: toolchain
        run: scripts/toolchain.sh .tool-versions >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node runtime drift
        env:
          EXPECTED_NODE: ${{ steps.toolchain.outputs.nodejs }}
        run: scripts/toolchain.sh --installed "nodejs=$EXPECTED_NODE"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict

      - name: Refuse BEAM runtime drift
        env:
          EXPECTED_ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.toolchain.outputs.otp }}
        run: scripts/toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"

      - name: Install pinned Hex
        run: mix local.hex 2.7.0 --force

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Build documentation
        run: mix docs --warnings-as-errors --formatter html

      - name: Record docs release provenance
        env:
          DOCS_PACKAGE: charter_agreement_protocol
        run: |
          elixir -e 'File.write!("doc/release.json", JSON.encode!(%{"package" => System.fetch_env!("DOCS_PACKAGE"), "version" => System.fetch_env!("VERSION"), "commit" => System.fetch_env!("RELEASE_COMMIT")}))'

      - name: Materialize the pinned verifier
        run: mix verifier.source

      - name: Inspect package contents and reproducibility
        run: mix release.candidate

      - name: Build the two release archives
        run: |
          mkdir release-assets
          mix hex.build --output "release-assets/charter_agreement_protocol-${VERSION}.tar"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C doc -cf - . | gzip -n -9 > "release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

      # The repository pin names unpacked content, not the OS-dependent gzip bytes.
      - name: Verify the built archive against the recorded content pin
        env:
          PACKAGE_TAR: ${{ github.workspace }}/release-assets/charter_agreement_protocol-${{ env.VERSION }}.tar
        run: |
          trap 'rm -rf "$HEX_HOME"' EXIT
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs -e '
            Hex.start()
            %{contents: files} = Hex.Tar.unpack!({:binary, File.read!(System.fetch_env!("PACKAGE_TAR"))}, :memory)
            identity = files
              |> Enum.map(fn {path, bytes} -> {to_string(path), bytes} end)
              |> Enum.sort()
              |> Enum.map_join(fn {path, bytes} -> path <> <<0>> <> <<byte_size(bytes)::64>> <> bytes end)
              |> then(&:crypto.hash(:sha256, &1))
              |> Base.url_encode64(padding: false)
            expected = File.read!(Path.join(System.fetch_env!("GITHUB_WORKSPACE"), ".release-archive.sha256")) |> String.trim()
            unless identity == expected, do: raise("built archive content differs from .release-archive.sha256")
          '

      - name: Refuse a package whose changelog is not stamped for its version
        shell: bash
        run: |
          python3 -I - "release-assets/charter_agreement_protocol-${VERSION}.tar" "$VERSION" <<'PY'
          import io, re, sys, tarfile
          archive, version = sys.argv[1], sys.argv[2]
          def refuse(message):
              raise SystemExit(f'{archive}: {message}; publication refused')
          with tarfile.open(archive, 'r:*') as outer:
              if 'contents.tar.gz' in outer.getnames():
                  package = tarfile.open(fileobj=io.BytesIO(outer.extractfile('contents.tar.gz').read()), mode='r:gz')
                  root = ''
              else:
                  package, root = outer, 'package/'
              found = [member for member in package.getmembers() if member.isfile()
                       and re.fullmatch(re.escape(root) + r'(?i:changelog(?:\.md|\.markdown|\.txt)?)', member.name)]
              if len(found) != 1:
                  refuse('the package must ship exactly one root CHANGELOG')
              try:
                  lines = package.extractfile(found[0]).read().decode('utf-8').splitlines()
              except UnicodeDecodeError:
                  refuse('the packaged CHANGELOG is not UTF-8')
          headings, fence = {}, False
          for index, line in enumerate(lines):
              if re.match(r' {0,3}(```|~~~)', line):
                  fence = not fence
              elif not fence and (match := re.match(r' {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$', line)):
                  headings[index] = (len(match.group(1)), match.group(2) or '')
          token = re.compile(r'(?<![0-9A-Za-z.+-])v?' + re.escape(version) + r'(?![0-9A-Za-z.+-])')
          stamped = [index for index, (_, title) in headings.items() if token.search(title)]
          if not stamped:
              refuse(f'the packaged CHANGELOG has no section for {version}')
          at, level = stamped[0], headings[stamped[0]][0]
          def written(start):
              end = next((index for index, (depth, _) in headings.items() if index > start and depth <= level), len(lines))
              return any(line.strip() for index, line in enumerate(lines[start + 1:end], start + 1) if index not in headings)
          if not written(at):
              refuse(f'the packaged CHANGELOG section for {version} is empty')
          for start, (depth, title) in headings.items():
              if start < at and depth == level and written(start):
                  refuse(f'the packaged CHANGELOG has entries above {version}, under "{title}"')
          print(f'{archive}: the packaged CHANGELOG is stamped for {version}')
          PY

      - name: Prepare an anonymous registry home
        run: mkdir "$RUNNER_TEMP/hex-read"

      - name: Plan uploads from the served registry bytes
        id: plan
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          trap 'rm -rf "$HEX_HOME"' EXIT
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$RUNNER_TEMP/release-workflow/hex_release_state.exs" --plan charter_agreement_protocol "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}.tar"

      - name: Record inspected archive checksums
        working-directory: release-assets
        run: sha256sum -- *.tar *.tar.gz > SHA256SUMS

      - name: Pass inspected archives to the upload job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inspected-release
          path: |
            release-assets/charter_agreement_protocol-${{ env.VERSION }}.tar
            release-assets/charter_agreement_protocol-${{ env.VERSION }}-docs.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [release, build]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: release-workflow

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ needs.build.outputs.elixir }}
          otp-version: ${{ needs.build.outputs.otp }}
          version-type: strict

      - name: Install pinned Hex
        working-directory: ${{ runner.temp }}
        run: mix local.hex 2.7.0 --force

      - name: Download inspected release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inspected-release
          path: release-assets

      - name: Verify inspected archive checksums
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS

      - name: Apply the verified archive upload plan
        if: needs.build.outputs.package == 'upload' || needs.build.outputs.docs == 'upload'
        working-directory: ${{ runner.temp }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          HEX_HOME: ${{ runner.temp }}/hex-upload
          PACKAGE_STATE: ${{ needs.build.outputs.package }}
          DOCS_STATE: ${{ needs.build.outputs.docs }}
        run: |
          trap 'rm -rf "$HEX_HOME"' EXIT
          flags=()
          if [ "$PACKAGE_STATE" = upload ]; then flags+=(--package); fi
          if [ "$DOCS_STATE" = upload ]; then flags+=(--docs); fi
          mix run --no-mix-exs "$GITHUB_WORKSPACE/release-workflow/scripts/hex_upload.exs" "${flags[@]}" charter_agreement_protocol "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}.tar" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

  read-back:
    needs: [release, build, upload]
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Load release scripts from the workflow revision
        run: |
          mkdir "$RUNNER_TEMP/release-workflow"
          git show "$GITHUB_SHA:scripts/hex_release_state.ex" > "$RUNNER_TEMP/release-workflow/hex_release_state.ex"
          git show "$GITHUB_SHA:scripts/hex_release_state.exs" > "$RUNNER_TEMP/release-workflow/hex_release_state.exs"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          elixir-version: ${{ needs.build.outputs.elixir }}
          otp-version: ${{ needs.build.outputs.otp }}
          version-type: strict

      - name: Install pinned Hex
        working-directory: ${{ runner.temp }}
        run: mix local.hex 2.7.0 --force

      - name: Download inspected release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inspected-release
          path: release-assets

      - name: Verify inspected archive checksums
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS

      - name: Require the served package and docs from the registry
        id: served
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$RUNNER_TEMP/release-workflow/hex_release_state.exs" --served charter_agreement_protocol "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}.tar" \
            --commit "$RELEASE_COMMIT" --clone "$GITHUB_WORKSPACE" \
            --docs-output "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

      - name: Record release checksums
        working-directory: release-assets
        run: sha256sum -- *.tar *.tar.gz > SHA256SUMS

      - name: Upload consumer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            release-assets/charter_agreement_protocol-${{ env.VERSION }}.tar
            release-assets/charter_agreement_protocol-${{ env.VERSION }}-docs.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Remove release archives and temporary Hex homes
        if: always()
        run: rm -rf release-assets "$RUNNER_TEMP/hex-read"
