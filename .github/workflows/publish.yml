name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 90 # no green run yet
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse refs outside the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Refuse Node runtime drift
        run: test "$(node --version)" = "v$(awk '$1 == "nodejs" {print $2}' .tool-versions)"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          install-hex: false
          version-file: .tool-versions
          version-type: strict

      - name: Refuse BEAM runtime drift
        run: |
          expected_elixir=$(awk '$1 == "elixir" {print $2}' .tool-versions)
          expected_otp=$(awk '$1 == "erlang" {print $2}' .tool-versions)
          actual_otp=$(erl -noshell -eval 'Major = erlang:system_info(otp_release), {ok, Bytes} = file:read_file(filename:join([code:root_dir(), "releases", Major, "OTP_VERSION"])), io:put_chars(string:trim(binary_to_list(Bytes))), halt().')
          test "$actual_otp" = "$expected_otp"
          test "$(elixir --short-version)" = "${expected_elixir%-otp-*}"

      - name: Install pinned Hex
        run: mix local.hex 2.7.0 --force

      - name: Install locked dependencies
        run: mix deps.get --check-locked

      - name: Refuse an existing remote release tag
        run: |
          version=$(sed -n 's/^  @version "\([^"]*\)".*$/\1/p' mix.exs)
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tags=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}")
          if [ -n "$tags" ]; then
            echo "::error::This release version is already tagged"
            exit 1
          fi

      - name: Build documentation
        run: mix docs --warnings-as-errors --formatter html

      - name: Materialize the pinned verifier
        run: mix verifier.source

      - name: Inspect package contents and reproducibility
        run: mix release.candidate

      - name: Build the two release archives
        run: |
          mkdir release-assets
          mix hex.build --output "release-assets/charter_agreement_protocol-${VERSION}.tar"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C doc -cf - . | gzip -n -9 > "release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

      # The repository pin names unpacked content, not the OS-dependent gzip bytes.
      - name: Verify the built archive against the recorded content pin
        env:
          PACKAGE_TAR: ${{ github.workspace }}/release-assets/charter_agreement_protocol-${{ env.VERSION }}.tar
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs -e '
            Hex.start()
            %{contents: files} = Hex.Tar.unpack!({:binary, File.read!(System.fetch_env!("PACKAGE_TAR"))}, :memory)
            identity = files
              |> Enum.map(fn {path, bytes} -> {to_string(path), bytes} end)
              |> Enum.sort()
              |> Enum.map_join(fn {path, bytes} -> path <> <<0>> <> <<byte_size(bytes)::64>> <> bytes end)
              |> then(&:crypto.hash(:sha256, &1))
              |> Base.url_encode64(padding: false)
            expected = File.read!(Path.join(System.fetch_env!("GITHUB_WORKSPACE"), ".release-archive.sha256")) |> String.trim()
            unless identity == expected, do: raise("built archive content differs from .release-archive.sha256")
          '

      - name: Record release checksums
        working-directory: release-assets
        run: sha256sum -- *.tar *.tar.gz > SHA256SUMS

      - name: Upload consumer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Prepare an anonymous registry home
        run: mkdir "$RUNNER_TEMP/hex-read"

      - name: Plan uploads from the served registry bytes
        id: plan
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/hex_release_state.exs" --plan charter_agreement_protocol "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}.tar" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

      - name: Upload only the missing verified archives
        if: steps.plan.outputs.package == 'upload' || steps.plan.outputs.docs == 'upload'
        working-directory: release-assets
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          HEX_HOME: ${{ runner.temp }}/hex-upload
          PACKAGE_STATE: ${{ steps.plan.outputs.package }}
          DOCS_STATE: ${{ steps.plan.outputs.docs }}
        run: |
          flags=()
          if [ "$PACKAGE_STATE" = upload ]; then flags+=(--package); fi
          if [ "$DOCS_STATE" = upload ]; then flags+=(--docs); fi
          mix run --no-mix-exs ../scripts/hex_upload.exs "${flags[@]}" charter_agreement_protocol "$VERSION" \
            "charter_agreement_protocol-${VERSION}.tar" "charter_agreement_protocol-${VERSION}-docs.tar.gz"

      - name: Require matching package and docs from the registry
        env:
          HEX_HOME: ${{ runner.temp }}/hex-read
        run: |
          cd "$RUNNER_TEMP"
          mix run --no-mix-exs "$GITHUB_WORKSPACE/scripts/hex_release_state.exs" --served charter_agreement_protocol "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}.tar" \
            "$GITHUB_WORKSPACE/release-assets/charter_agreement_protocol-${VERSION}-docs.tar.gz"

      - name: Remove release archives and temporary Hex homes
        if: always()
        run: rm -rf release-assets "$RUNNER_TEMP/hex-deps" "$RUNNER_TEMP/hex-read" "$RUNNER_TEMP/hex-upload"
