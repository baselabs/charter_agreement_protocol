name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  quality:
    name: Complete quality gate
    # The revision-3 corpus needs a linked OpenSSL >= 3.5: FIPS 204 (ML-DSA)
    # reached OpenSSL in 3.5.0, bob's OTP builds dynamically link the distro
    # libcrypto.so.3 with nothing bundled, and ubuntu-24.04 ships OpenSSL
    # 3.0.x, which cannot generate or verify ML-DSA keys at all (EVP
    # "Bad key type"; the corpus fail-closes every ML-DSA verdict as
    # signature_invalid). ubuntu-26.04 ships OpenSSL 3.5.x, and setup-beam
    # resolves the matching bob build per distro, so both matrix legs keep
    # their pinned OTP/Elixir versions.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pinned, elixir: "1.20.3", otp: "29.0.3", node: "24" }
          # Floor lane mirrors the signer sibling's (charter_agreement_signer):
          # Elixir 1.19.5 on the 28.x major, ubuntu-26.04 for OpenSSL 3.5. The
          # supported-OTP set is {28, 29} — 28 carries this lane, 29 the pinned
          # lane (config/config.exs lockstep rule).
          - { name: floor, elixir: "1.19.5", otp: "28.5.0.3", node: "24.8" }
    steps:
      # Full history: the standing historical differential gate reads the
      # frozen certified corpora by tag (git show v0.1.0:priv/conformance/...),
      # which a shallow clone cannot resolve.
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get

      # The currency gate also runs inside `mix quality` below; this explicit
      # step names resolvable drift as its own CI failure so a stale lock is
      # not buried in the battery output. Runs on every lane's native shell —
      # the gate itself is an Elixir script with no POSIX dependency.
      - name: Check dependency currency
        run: mix currency.check

      - name: Run complete quality gate
        run: mix quality

  # The capability-limited lane: the honest-failure evidence for substrates
  # that cannot verify ML-DSA. Ubuntu 24.04 ships OpenSSL 3.0.x, where the
  # ML-DSA rows report unverifiable and verification fails with the named
  # algorithm_unsupported_on_substrate diagnostic instead of a forgery
  # verdict (the same assertions are green on the capable lanes above — the
  # test is substrate-neutral, the evidence is per-substrate). This lane is
  # deliberately always green; it is the evidence-model home for substrate-
  # only requirements (docs/guides/error-codes.md).
  capability-limited:
    name: Capability-limited substrate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "28.5.0.3"

      - name: Install dependencies
        run: mix deps.get

      - name: Report runtime capabilities
        run: |
          mix run --no-start -e 'IO.inspect(CharterAgreementProtocol.capabilities(), structs: false, width: 120)'

      - name: Assert the lane substrate itself (ML-DSA unverifiable here)
        run: |
          mix run --no-start -e '
          report = CharterAgreementProtocol.capabilities()
          mldsa = Enum.filter(report.algorithms, &String.starts_with?(&1.name, "ML-DSA-"))
          others = Enum.reject(report.algorithms, &String.starts_with?(&1.name, "ML-DSA-"))
          Enum.each(mldsa, fn row ->
            unless row.verifiable == false, do: raise("lane substrate gained ML-DSA (#{row.name}) — the honest-failure lane must move to an older substrate")
          end)
          Enum.each(others, fn row ->
            unless row.verifiable == true, do: raise("lane substrate lost #{row.name} — the lane must verify the classical rows")
          end)
          IO.puts("capability-limited substrate confirmed: ML-DSA unverifiable, classical verifiable")
          '

      - name: Capability-limited assertions
        run: mix test test/charter_agreement_protocol/capability_lane_test.exs

  # The Windows clone-and-build bar: a fresh checkout must fetch
  # dependencies and compile under the declared toolchain on a Windows host.
  # setup-beam resolves the official Erlang/OTP Windows builds (otp "29",
  # the major pinned by config/config.exs; the Windows patch line follows
  # the official installer, not bob) and the Elixir precompiled archive.
  # The lane's own capability report observed the official OTP 29 Windows
  # build linking OpenSSL 3.5.5 with every :mldsa44/65/87 atom present, so
  # the full test suite runs here too — clone-build-test on Windows
  # (see docs/adr/supported-otp-set.md).
  windows-build:
    name: Windows clone-and-build
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29"

      # The harness tests run the Node verifiers, whose engines floor is 24;
      # the runner's stock Node predates it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (test environment)
        run: $env:MIX_ENV='test'; mix compile --warnings-as-errors

      # Always green, informational: declares the Windows runtime's linked
      # crypto and ML-DSA capability into the CI record, so the decision to
      # extend this lane to `mix test` rests on an observed fact instead of
      # an assumption (the corpus needs :mldsa44/65/87 and OpenSSL >= 3.5).
      # The snippet deliberately contains no quote characters of any kind —
      # pwsh strips embedded double quotes when passing native arguments.
      - name: Report runtime crypto capability
        run: |
          elixir -e 'IO.inspect(:crypto.info_lib()); IO.inspect([:mldsa44, :mldsa65, :mldsa87] -- :crypto.supports(:public_keys))'

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check dependency currency
        run: mix currency.check

      # The capability report above observed the official OTP 29 Windows
      # build linking OpenSSL 3.5.5 with every :mldsa44/65/87 atom present,
      # so the full suite runs here too — the clone-and-build bar extends to
      # clone-build-test on Windows.
      - name: Run the full test suite
        run: $env:MIX_ENV='test'; mix test --seed 42
