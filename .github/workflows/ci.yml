name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint pinned to its release commit for v1.7.12, verified first-hand
      # against the rhysd/actionlint tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database.
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks pinned to its release commit for v8.30.1, verified first-hand
      # against the gitleaks/gitleaks tags API. `go run` fetches the module by
      # commit, content-addressed through the Go checksum database. Scans the
      # complete commit history, not just the head tree.
      - name: Run gitleaks over full history
        run: go run github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e git --config .gitleaks.toml --redact --no-banner

  quality:
    name: Complete quality gate
    # The revision-3 corpus needs a linked OpenSSL >= 3.5: FIPS 204 (ML-DSA)
    # reached OpenSSL in 3.5.0, bob's OTP builds dynamically link the distro
    # libcrypto.so.3 with nothing bundled, and ubuntu-24.04 ships OpenSSL
    # 3.0.x, which cannot generate or verify ML-DSA keys at all (EVP
    # "Bad key type"; the corpus fail-closes every ML-DSA verdict as
    # signature_invalid). ubuntu-26.04 ships OpenSSL 3.5.x, and setup-beam
    # resolves the matching bob build per distro, so both matrix legs keep
    # their pinned OTP/Elixir versions.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pinned, elixir: "1.20.3", otp: "29.0.3", node: "24" }
          # Floor lane mirrors the signer sibling's (charter_agreement_signer):
          # Elixir 1.19.5 on the 28.x major, ubuntu-26.04 for OpenSSL 3.5. The
          # supported-OTP set is {28, 29} — 28 carries this lane, 29 the pinned
          # lane (config/config.exs lockstep rule).
          - { name: floor, elixir: "1.19.5", otp: "28.5.0.3", node: "24.8" }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get

      # The currency gate also runs inside `mix quality` below; this explicit
      # step names resolvable drift as its own CI failure so a stale lock is
      # not buried in the battery output. Runs on every lane's native shell —
      # the gate itself is an Elixir script with no POSIX dependency.
      - name: Check dependency currency
        run: mix currency.check

      - name: Run complete quality gate
        run: mix quality

  # The Windows clone-and-build bar: a fresh checkout must fetch
  # dependencies and compile under the declared toolchain on a Windows host.
  # setup-beam resolves the official Erlang/OTP Windows builds (otp "29",
  # the major pinned by config/config.exs; the Windows patch line follows
  # the official installer, not bob) and the Elixir precompiled archive.
  # The full test suite is deliberately NOT run here: the revision-3
  # ML-DSA corpus needs the runtime's linked OpenSSL >= 3.5, and the
  # official Windows OTP binaries' bundled OpenSSL is not a declared fact —
  # extending this lane to `mix test` is gated on that (see
  # docs/adr/supported-otp-set.md).
  windows-build:
    name: Windows clone-and-build
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.3"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (test environment)
        run: $env:MIX_ENV='test'; mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check dependency currency
        run: mix currency.check
