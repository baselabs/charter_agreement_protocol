title = "charter_agreement_protocol gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic signed conformance fixtures are public test vectors, not credentials"
targetRules = ["jwt"]
paths = [
  '''^lib/charter_agreement_protocol/capability\.ex$''',
  '''^conformance/cases/(party_descriptor-verify|descriptor_chain-verify|acceptance-verify|acceptance-equivocation|termination-verify|chain-verify|chain-verify_profile|governing_revision|receipt-verify|signing-prepare)\.json$''',
  '''^priv/conformance/cases/(party_descriptor-verify|descriptor_chain-verify|acceptance-verify|acceptance-equivocation|termination-verify|chain-verify|chain-verify_profile|governing_revision|receipt-verify|signing-prepare)\.json$''',
  '''^verifier/conformance/cases/(party_descriptor-verify|descriptor_chain-verify|acceptance-verify|acceptance-equivocation|termination-verify|chain-verify|chain-verify_profile|governing_revision|receipt-verify|signing-prepare)\.json$'''
]

[[allowlists]]
description = "Vendored strict Ed25519 test vectors: public keys, signatures and messages only (the source corpus declares private_material_tracked false)"
targetRules = ["jwt", "generic-api-key"]
paths = [
  '''^test/fixtures/strict-ed25519/cases/[^/]+/[^/]+\.json$'''
]

[[allowlists]]
description = "Pinned known-answer verification vectors are public test data, not credentials"
targetRules = ["github-app-token"]
paths = [
  '''^lib/charter_agreement_protocol/capability\.ex$''',
  '''^verifier/core\.ts$'''
]
